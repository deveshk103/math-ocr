[package]
name = "snip_ocr"
version = "0.1.0"
edition = "2021"
description = "Low-RAM (<= 400 MB peak), offline Windows 11 snip-to-Markdown/LaTeX OCR tool using subprocess-isolated ONNX Runtime stages"
license = "MIT"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = "0.25.10"
# Pinned to match oar-ocr 0.10.2 so Cargo resolves a single ort / ort-sys instance
ort = "=2.0.0-rc.13"
oar-ocr = { version = "0.10.2", features = ["auto-download"] }
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
ureq = "2.10"
arboard = "3.4"
global-hotkey = "0.10"
regex = "1.11"
tempfile = "3.19"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
